<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Aniq - Freelance Web Developer, Founder of Jombina">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08080A"/>
      <stop offset="55%" stop-color="#110F14"/>
      <stop offset="100%" stop-color="#1C0F09"/>
    </linearGradient>

    <linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="-500" y1="0" x2="-100" y2="0">
      <stop offset="0%"   stop-color="#E8562F"/>
      <stop offset="40%"  stop-color="#FFB07C"/>
      <stop offset="52%"  stop-color="#FFF4EC"/>
      <stop offset="64%"  stop-color="#FFB07C"/>
      <stop offset="100%" stop-color="#E8562F"/>
      <animate attributeName="x1" from="-500" to="1000" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="-100" to="1400" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="orbA">
      <stop offset="0%" stop-color="#E8562F" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E8562F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB">
      <stop offset="0%" stop-color="#6A4BFF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#6A4BFF" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 L0 0 0 44" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.05"/>
    </pattern>

    <clipPath id="round"><rect width="1000" height="340" rx="16"/></clipPath>

    <style>
      @keyframes draw   { to { stroke-dashoffset: 0; } }
      @keyframes fillIn { to { fill-opacity: 1; } }
      @keyframes rise   { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes blink  { 0%,49% { fill-opacity: 1; } 50%,100% { fill-opacity: 0; } }
      @keyframes drift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(70px,-45px); } }
      @keyframes drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-80px,50px); } }
      @keyframes grow   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes bob    { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes ping   { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

      .o1 { animation: drift1 13s ease-in-out infinite; }
      .o2 { animation: drift2 17s ease-in-out infinite; }

      .nameStroke {
        fill: none; stroke: url(#shimmer); stroke-width: 1.5;
        stroke-dasharray: 1500; stroke-dashoffset: 1500;
        animation: draw 2.4s cubic-bezier(.45,0,.15,1) forwards;
      }
      .nameFill {
        fill: url(#shimmer); fill-opacity: 0;
        animation: fillIn 1.3s ease-out 1.9s forwards;
      }

      .s1 { animation: rise .7s ease-out .2s both; }
      .s2 { animation: rise .7s ease-out 2.3s both; }
      .s3 { animation: rise .7s ease-out 2.6s both; }
      .s4 { animation: rise .7s ease-out 2.9s both; }
      .s5 { animation: rise .7s ease-out 3.2s both; }

      .cursor { animation: blink 1.05s step-end infinite; }
      .bar    { transform-origin: left center; animation: grow 1.1s cubic-bezier(.45,0,.15,1) 2.1s both; }
      .bob    { animation: bob 4.5s ease-in-out infinite; }
      .ping   { animation: ping 2.2s ease-in-out infinite; }

      .mono { font-family: "SFMono-Regular","Consolas","Liberation Mono","Courier New",monospace; }
      .sans { font-family: "Segoe UI","Helvetica Neue",Arial,sans-serif; }
      .head { font-family: "Segoe UI Black","Arial Black","Helvetica Neue",Arial,sans-serif; font-weight: 900; }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="340" fill="url(#bgGrad)"/>
    <rect width="1000" height="340" fill="url(#grid)"/>

    <circle class="o1" cx="150" cy="60"  r="160" fill="url(#orbA)"/>
    <circle class="o2" cx="880" cy="300" r="180" fill="url(#orbB)"/>

    <path d="M26 26 h32 M26 26 v32" stroke="#E8562F" stroke-width="2" opacity="0.7"/>
    <path d="M974 314 h-32 M974 314 v-32" stroke="#E8562F" stroke-width="2" opacity="0.7"/>

    <!-- kicker -->
    <g class="s1">
      <rect x="66" y="55" width="8" height="8" fill="#E8562F"/>
      <text class="mono" x="86" y="63" font-size="12" letter-spacing="3.5" fill="#7E7E88">JOHOR, MALAYSIA</text>
    </g>

    <!-- name -->
    <text class="head nameStroke" x="64" y="172" font-size="100" letter-spacing="-3">ANIQ</text>
    <text class="head nameFill"   x="64" y="172" font-size="100" letter-spacing="-3">ANIQ</text>

    <rect class="bar" x="66" y="192" width="286" height="4" rx="2" fill="#E8562F"/>

    <!-- role -->
    <text class="sans s2" x="66" y="232" font-size="20" fill="#E9E9ED" font-weight="600">
      Freelance Web Developer
      <tspan fill="#45454D" font-weight="400"> &#47;&#47; </tspan>
      <tspan fill="#E8562F">Founder of Jombina</tspan>
    </text>

    <!--
      Cursor jadi tspan dalam text yang sama, bukan rect berasingan.
      Sebab lebar monospace berubah ikut font machine visitor, kalau guna
      coordinate hardcode dia akan tersasar kat sesetengah orang.
    -->
    <g class="s3">
      <text class="mono" x="66" y="268" font-size="13.5" fill="#67676F"><tspan fill="#E8562F">&#8250;</tspan> building websites &amp; systems for malaysian businesses <tspan class="cursor" fill="#E8562F">&#9608;</tspan></text>
    </g>

    <!-- chips -->
    <g class="s4">
      <g transform="translate(66,290)">
        <rect width="92" height="26" rx="13" fill="#E8562F" fill-opacity="0.10" stroke="#E8562F" stroke-opacity="0.35"/>
        <text class="mono" x="46" y="17" font-size="10.5" fill="#FF9166" text-anchor="middle" letter-spacing="1.2">NEXT.JS</text>
      </g>
      <g transform="translate(168,290)">
        <rect width="76" height="26" rx="13" fill="#E8562F" fill-opacity="0.10" stroke="#E8562F" stroke-opacity="0.35"/>
        <text class="mono" x="38" y="17" font-size="10.5" fill="#FF9166" text-anchor="middle" letter-spacing="1.2">ASTRO</text>
      </g>
      <g transform="translate(254,290)">
        <rect width="102" height="26" rx="13" fill="#E8562F" fill-opacity="0.10" stroke="#E8562F" stroke-opacity="0.35"/>
        <text class="mono" x="51" y="17" font-size="10.5" fill="#FF9166" text-anchor="middle" letter-spacing="1.2">SUPABASE</text>
      </g>
      <g transform="translate(366,290)">
        <rect width="114" height="26" rx="13" fill="#E8562F" fill-opacity="0.10" stroke="#E8562F" stroke-opacity="0.35"/>
        <text class="mono" x="57" y="17" font-size="10.5" fill="#FF9166" text-anchor="middle" letter-spacing="1.2">TYPESCRIPT</text>
      </g>
    </g>

    <!--
      FIX: outer <g> carries the position, inner <g> carries the animation.
      Kalau kedua-dua letak kat element sama, CSS transform akan override
      attribute transform dan element tu lompat ke corner.
    -->
    <g transform="translate(744,116)">
      <g class="s5">
        <g class="bob">
          <rect width="196" height="108" rx="14" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.10"/>
          <circle class="ping" cx="24" cy="28" r="5" fill="#33D17A"/>
          <text class="mono" x="40" y="32" font-size="10" fill="#8C8C96" letter-spacing="1.5">OPEN FOR PROJECTS</text>
          <text class="head" x="24" y="68" font-size="25" fill="#FFFFFF">jombina</text>
          <text class="head" x="123" y="68" font-size="25" fill="#E8562F">.site</text>
          <text class="mono" x="24" y="90" font-size="10" fill="#67676F" letter-spacing="0.4">web &#183; systems &#183; automation</text>
        </g>
      </g>
    </g>
  </g>
</svg>
