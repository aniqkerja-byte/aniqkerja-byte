<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Aniq - Freelance Web Developer, Founder of Jombina">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0C"/>
      <stop offset="55%" stop-color="#121016"/>
      <stop offset="100%" stop-color="#1A0F0B"/>
    </linearGradient>

    <linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="-400" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#E8562F"/>
      <stop offset="45%" stop-color="#FFC48A"/>
      <stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8562F"/>
      <animate attributeName="x1" from="-400" to="1000" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0" to="1400" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="orbA">
      <stop offset="0%" stop-color="#E8562F" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#E8562F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB">
      <stop offset="0%" stop-color="#7C4DFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>

    <clipPath id="round"><rect width="1000" height="340" rx="18"/></clipPath>

    <style>
      @keyframes draw   { to { stroke-dashoffset: 0; } }
      @keyframes fillIn { to { fill-opacity: 1; } }
      @keyframes rise   { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes blink  { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      @keyframes floatA { 0%,100% { transform: translate(0,0); } 50% { transform: translate(60px,-40px); } }
      @keyframes floatB { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-70px,45px); } }
      @keyframes grow   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes pulse  { 0%,100% { opacity: 0.25; } 50% { opacity: 0.7; } }
      @keyframes bob    { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

      .orbA  { animation: floatA 11s ease-in-out infinite; }
      .orbB  { animation: floatB 14s ease-in-out infinite; }
      .gridL { animation: pulse 6s ease-in-out infinite; }

      .nameStroke {
        fill: none; stroke: url(#shimmer); stroke-width: 1.6;
        stroke-dasharray: 1400; stroke-dashoffset: 1400;
        animation: draw 2.6s cubic-bezier(.5,0,.2,1) forwards;
      }
      .nameFill {
        fill: url(#shimmer); fill-opacity: 0;
        animation: fillIn 1.4s ease-out 2s forwards;
      }

      .kicker  { animation: rise .8s ease-out .3s both; }
      .role    { animation: rise .8s ease-out 2.5s both; }
      .term    { animation: rise .8s ease-out 2.9s both; }
      .chips   { animation: rise .8s ease-out 3.2s both; }
      .cursor  { animation: blink 1s step-end infinite; }
      .bar     { transform-origin: 70px 0; animation: grow 1.2s cubic-bezier(.5,0,.2,1) 2.3s both; }
      .badge   { animation: bob 4s ease-in-out infinite; }

      .mono { font-family: "SFMono-Regular", "Consolas", "Liberation Mono", "Courier New", monospace; }
      .sans { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .head { font-family: "Segoe UI Black", "Arial Black", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="340" fill="url(#bgGrad)"/>
    <rect class="gridL" width="1000" height="340" fill="url(#grid)"/>

    <circle class="orbA" cx="180" cy="80"  r="150" fill="url(#orbA)"/>
    <circle class="orbB" cx="860" cy="290" r="170" fill="url(#orbB)"/>
    <circle class="orbA" cx="780" cy="60"  r="110" fill="url(#orbA)" opacity="0.6"/>

    <!-- corner ticks -->
    <path d="M28 28 h34 M28 28 v34" stroke="#E8562F" stroke-width="2" opacity="0.8"/>
    <path d="M972 312 h-34 M972 312 v-34" stroke="#E8562F" stroke-width="2" opacity="0.8"/>

    <!-- kicker -->
    <g class="kicker">
      <rect x="70" y="56" width="9" height="9" fill="#E8562F"/>
      <text class="mono" x="92" y="65" font-size="13" letter-spacing="3.5" fill="#8A8A93">
        JOHOR, MALAYSIA &#8226; AVAILABLE FOR WORK
      </text>
    </g>

    <!-- name: stroke draws first, then fill fades in -->
    <text class="head nameStroke" x="70" y="168" font-size="104" letter-spacing="-3">ANIQ</text>
    <text class="head nameFill"   x="70" y="168" font-size="104" letter-spacing="-3">ANIQ</text>

    <!-- accent bar -->
    <rect class="bar" x="70" y="188" width="300" height="4" rx="2" fill="#E8562F"/>

    <!-- role -->
    <text class="sans role" x="70" y="228" font-size="21" fill="#E7E7EA" font-weight="600">
      Freelance Web Developer
      <tspan fill="#4A4A52" font-weight="400"> &#47;&#47; </tspan>
      <tspan fill="#E8562F">Founder of Jombina</tspan>
    </text>

    <!-- terminal line -->
    <g class="term">
      <text class="mono" x="70" y="264" font-size="14" fill="#6B6B75">
        <tspan fill="#E8562F">&#8250;</tspan> building websites &amp; systems for malaysian businesses
      </text>
      <rect class="cursor" x="452" y="253" width="8" height="14" fill="#E8562F"/>
    </g>

    <!-- chips -->
    <g class="chips">
      <g transform="translate(70,286)">
        <rect width="96" height="26" rx="13" fill="#E8562F" fill-opacity="0.12" stroke="#E8562F" stroke-opacity="0.4"/>
        <text class="mono" x="48" y="17" font-size="11" fill="#FF9166" text-anchor="middle" letter-spacing="1">NEXT.JS</text>
      </g>
      <g transform="translate(176,286)">
        <rect width="80" height="26" rx="13" fill="#E8562F" fill-opacity="0.12" stroke="#E8562F" stroke-opacity="0.4"/>
        <text class="mono" x="40" y="17" font-size="11" fill="#FF9166" text-anchor="middle" letter-spacing="1">ASTRO</text>
      </g>
      <g transform="translate(266,286)">
        <rect width="106" height="26" rx="13" fill="#E8562F" fill-opacity="0.12" stroke="#E8562F" stroke-opacity="0.4"/>
        <text class="mono" x="53" y="17" font-size="11" fill="#FF9166" text-anchor="middle" letter-spacing="1">SUPABASE</text>
      </g>
      <g transform="translate(382,286)">
        <rect width="120" height="26" rx="13" fill="#E8562F" fill-opacity="0.12" stroke="#E8562F" stroke-opacity="0.4"/>
        <text class="mono" x="60" y="17" font-size="11" fill="#FF9166" text-anchor="middle" letter-spacing="1">TYPESCRIPT</text>
      </g>
    </g>

    <!-- floating badge, right side -->
    <g class="badge" transform="translate(742,120)">
      <rect width="196" height="104" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <circle cx="24" cy="28" r="5" fill="#33D17A"/>
      <text class="mono" x="40" y="32" font-size="11" fill="#9A9AA4" letter-spacing="1.5">OPEN FOR PROJECTS</text>
      <text class="head" x="24" y="66" font-size="26" fill="#FFFFFF">jombina</text>
      <text class="head" x="128" y="66" font-size="26" fill="#E8562F">.site</text>
      <text class="mono" x="24" y="88" font-size="10.5" fill="#6B6B75" letter-spacing="0.5">web &#183; systems &#183; automation</text>
    </g>
  </g>
</svg>
