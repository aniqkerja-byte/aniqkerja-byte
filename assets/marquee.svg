<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 58" width="1000" height="58" role="img" aria-label="Tech stack marquee">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#000" stop-opacity="0"/>
      <stop offset="9%"   stop-color="#fff" stop-opacity="1"/>
      <stop offset="91%"  stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <mask id="fadeMask">
      <rect width="1000" height="58" fill="url(#fade)"/>
    </mask>
    <clipPath id="r"><rect width="1000" height="58" rx="10"/></clipPath>

    <style>
      @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-1180px); } }
      .track { animation: slide 22s linear infinite; }
      .m { font-family: "SFMono-Regular","Consolas","Liberation Mono","Courier New",monospace;
           font-size: 15px; letter-spacing: 2px; fill: #C9C9D1; }
      .dot { fill: #E8562F; }
    </style>

    <g id="row">
      <text class="m" x="0"    y="37">NEXT.JS</text>
      <circle class="dot" cx="106" cy="31" r="3.5"/>
      <text class="m" x="128"  y="37">ASTRO</text>
      <circle class="dot" cx="210" cy="31" r="3.5"/>
      <text class="m" x="232"  y="37">TYPESCRIPT</text>
      <circle class="dot" cx="374" cy="31" r="3.5"/>
      <text class="m" x="396"  y="37">TAILWIND</text>
      <circle class="dot" cx="524" cy="31" r="3.5"/>
      <text class="m" x="546"  y="37">SUPABASE</text>
      <circle class="dot" cx="696" cy="31" r="3.5"/>
      <text class="m" x="718"  y="37">GSAP</text>
      <circle class="dot" cx="790" cy="31" r="3.5"/>
      <text class="m" x="812"  y="37">POSTGRES</text>
      <circle class="dot" cx="972" cy="31" r="3.5"/>
      <text class="m" x="994"  y="37">FASTAPI</text>
      <circle class="dot" cx="1128" cy="31" r="3.5"/>
    </g>
  </defs>

  <g clip-path="url(#r)">
    <rect width="1000" height="58" fill="#0E0E12"/>
    <rect width="1000" height="58" fill="none" stroke="#E8562F" stroke-opacity="0.18"/>
    <g mask="url(#fadeMask)">
      <g class="track">
        <use href="#row" x="0"/>
        <use href="#row" x="1180"/>
        <use href="#row" x="2360"/>
      </g>
    </g>
  </g>
</svg>
