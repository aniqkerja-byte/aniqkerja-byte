<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 56" width="1000" height="56" role="img" aria-label="Tech stack">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#000" stop-opacity="0"/>
      <stop offset="10%"  stop-color="#fff" stop-opacity="1"/>
      <stop offset="90%"  stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <mask id="fadeMask"><rect width="1000" height="56" fill="url(#fade)"/></mask>
    <clipPath id="r"><rect width="1000" height="56" rx="10"/></clipPath>

    <style>
      @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-1011px); } }
      .track { animation: slide 20s linear infinite; }
      .m { font-family: "SFMono-Regular","Consolas","Liberation Mono","Courier New",monospace;
           font-size: 15px; letter-spacing: 2px; fill: #BFBFC8; }
      .d { fill: #E8562F; }
    </style>

    <g id="row">
      <text class="m" x="0"   y="36">NEXT.JS</text>
      <circle class="d" cx="101" cy="30" r="3"/>
      <text class="m" x="125" y="36">ASTRO</text>
      <circle class="d" cx="204" cy="30" r="3"/>
      <text class="m" x="228" y="36">TYPESCRIPT</text>
      <circle class="d" cx="362" cy="30" r="3"/>
      <text class="m" x="386" y="36">TAILWIND</text>
      <circle class="d" cx="498" cy="30" r="3"/>
      <text class="m" x="522" y="36">SUPABASE</text>
      <circle class="d" cx="634" cy="30" r="3"/>
      <text class="m" x="658" y="36">GSAP</text>
      <circle class="d" cx="726" cy="30" r="3"/>
      <text class="m" x="750" y="36">POSTGRES</text>
      <circle class="d" cx="862" cy="30" r="3"/>
      <text class="m" x="886" y="36">FASTAPI</text>
      <circle class="d" cx="987" cy="30" r="3"/>
    </g>
  </defs>

  <g clip-path="url(#r)">
    <rect width="1000" height="56" fill="#0C0C10"/>
    <rect width="1000" height="56" rx="10" fill="none" stroke="#E8562F" stroke-opacity="0.16"/>
    <g mask="url(#fadeMask)">
      <g class="track">
        <use href="#row" x="0"/>
        <use href="#row" x="1011"/>
        <use href="#row" x="2022"/>
      </g>
    </g>
  </g>
</svg>
